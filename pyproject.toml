[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elabftw-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
elabftw = "elabftw_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/elabftw_cli"]
